[package]
name = "substructure-napi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
substructure-core = { path = "../substructure-core" }
napi = { version = "2", features = ["async", "serde-json", "tokio_rt"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["serde", "v7"] }

[build-dependencies]
napi-build = "2"
