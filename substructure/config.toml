[logging]
level = "debug"
format = "compact"

[event_store]
type = "sqlite"
path = "events.db"

[otel]
endpoint = "http://localhost:4317"
service_name = "substructure"

[secret_providers]
env = { type = "env" }

[llm_clients.openrouter]
type = "openrouter"
base_url = "https://openrouter.ai/api"
api_key = { provider = "env", key = "OPENROUTER_API_KEY" }


[[budget_policies]]
name = "output_cap"
group_by = ["session_id"]
dimension = "completion_tokens"
limit = 4096
window = "1m"
strategy = "interrupt"

