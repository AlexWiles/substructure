// Worker interface contract.
// Defines all types crossing the worker boundary — proto is the source of truth.
// Generated Rust types are used by the Worker trait and WorkerExecutor trait.
syntax = "proto3";
package worker;

import "google/protobuf/struct.proto";

// --- Agent info (subset of internal AgentConfig) ---

message AgentInfo {
  string name = 1;
  optional string description = 2;
  string system_prompt = 3;
  string model = 4;
  optional double temperature = 5;
  optional uint64 max_completion_tokens = 6;
}

// --- Messages (LLM conversation) ---

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_SYSTEM = 1;
  ROLE_USER = 2;
  ROLE_ASSISTANT = 3;
  ROLE_TOOL = 4;
}

message ToolCall {
  string id = 1;
  string name = 2;
  string arguments = 3;
}

message Message {
  Role role = 1;
  optional string content = 2;
  repeated ToolCall tool_calls = 3;
  optional string tool_call_id = 4;
  optional string call_id = 5;
  optional google.protobuf.Value usage = 6;
}

// --- LLM request ---

message LlmToolFunction {
  string name = 1;
  string description = 2;
  google.protobuf.Value parameters = 3;
}

message LlmTool {
  string tool_type = 1;
  LlmToolFunction function = 2;
}

message LlmRequest {
  string model = 1;
  repeated Message messages = 2;
  repeated LlmTool tools = 3;
  optional double temperature = 4;
  optional uint64 max_completion_tokens = 5;
}

// --- Tool results ---

message ToolResult {
  string tool_call_id = 1;
  string name = 2;
  string content = 3;
  bool is_error = 4;
}

// --- Artifacts ---

message Part {
  oneof kind {
    string text = 1;
    google.protobuf.Value data = 2;
  }
}

message Artifact {
  optional string name = 1;
  optional string description = 2;
  repeated Part parts = 3;
}

// --- Call statuses ---

enum CallStatus {
  CALL_STATUS_UNSPECIFIED = 0;
  CALL_STATUS_PENDING = 1;
  CALL_STATUS_COMPLETED = 2;
  CALL_STATUS_FAILED = 3;
  CALL_STATUS_RETRY_SCHEDULED = 4;
}

// --- Decision trigger (input to decide) ---

message DecisionTrigger {
  oneof trigger {
    UserMessage user_message = 1;
    LlmCompleted llm_completed = 2;
    LlmFailed llm_failed = 3;
    ToolResolved tool_resolved = 4;
    InterruptResumed interrupt_resumed = 5;
    Stall stall = 6;
  }
}

message UserMessage {
  bool stream = 1;
  Message message = 2;
}

message LlmCompleted {
  string call_id = 1;
  Message message = 2;
  bool truncated = 3;
}

message LlmFailed {
  string call_id = 1;
  string error = 2;
}

message ToolResolved {
  ToolResult result = 1;
}

message InterruptResumed {
  string interrupt_id = 1;
}

message Stall {}

// --- Worker context (input to decide) ---

message WorkerCtx {
  string session_id = 1;
  bool stream = 2;
  AgentInfo agent = 3;
  repeated LlmTool tools = 4;
  repeated string sub_agent_names = 5;
  map<string, uint64> token_usage = 6;
  map<string, CallStatus> tool_call_statuses = 7;
  map<string, CallStatus> llm_call_statuses = 8;
}

// --- Worker actions (output from decide) ---

message ToolCallAction {
  ToolCall tool_call = 1;
  google.protobuf.Value context = 2;
}

message WorkerAction {
  oneof action {
    RequestLlm request_llm = 1;
    RequestToolCalls request_tool_calls = 2;
    Done done = 3;
  }
}

message RequestLlm {
  LlmRequest request = 1;
  bool stream = 2;
}

message RequestToolCalls {
  repeated ToolCallAction tool_calls = 1;
}

message Done {
  repeated Artifact artifacts = 1;
}

// --- Worker decision (return from decide) ---

message WorkerDecision {
  repeated WorkerAction actions = 1;
  bytes state = 2;
}

// --- Wire messages (dispatch) ---

message WorkerDispatch {
  string session_id = 1;
  string decision_id = 2;
  DecisionTrigger trigger = 3;
  bytes worker_state = 4;
  bool stream = 5;
  AgentInfo agent = 6;
  map<string, uint64> token_usage = 7;
  map<string, CallStatus> tool_call_statuses = 8;
  map<string, CallStatus> llm_call_statuses = 9;
  string span_json = 10;
}

message ToolCallDispatch {
  string session_id = 1;
  string tool_call_id = 2;
  string name = 3;
  string arguments = 4;
  google.protobuf.Value context = 5;
  optional uint64 max_result_bytes = 6;
  string span_json = 7;
}

// --- Tool call result (returned from executor) ---

message ToolCallResult {
  string tool_call_id = 1;
  string name = 2;
  oneof outcome {
    string result = 3;
    string error = 4;
  }
  optional bytes worker_state = 5;
}

// --- gRPC service ---

service WorkerService {
  rpc Decide(WorkerDispatch) returns (WorkerDecision);
  rpc ExecuteToolCall(ToolCallDispatch) returns (ToolCallResult);
}
