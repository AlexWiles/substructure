name = "example"

[llm.openrouter]
type = "openrouter"

[agent.oncall]
llm = "openrouter"
model = "anthropic/claude-haiku-4.5"
system = "You are the on-call assistant. Use the tools. Be terse."
plugins = ["runbooks"]

[plugin.runbooks]
path = "./plugins/runbooks"
# The file server wants no credential; saying so keeps it out of every report
# of what is left to authorize.
auth = { files = "none" }

[run]
agent = "oncall"
output = "pretty"
