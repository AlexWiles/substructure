<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>frontend-tool · substructure</title>
        <style>
            :root {
                --bg: #f6f5f1;
                --accent: #2563eb;
                --fg: #1c1c1c;
                --muted: #6b7280;
                --card: rgba(255, 255, 255, 0.7);
            }
            * { box-sizing: border-box; }
            html, body { margin: 0; height: 100%; }
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
                background: var(--bg);
                color: var(--fg);
                display: flex;
                justify-content: center;
                transition: background 0.6s ease;
            }
            .wrap {
                width: min(640px, 100%);
                height: 100%;
                display: flex;
                flex-direction: column;
                padding: 24px 16px;
            }
            header { padding: 8px 4px 16px; }
            header h1 { margin: 0 0 4px; font-size: 18px; }
            header p { margin: 0; color: var(--muted); font-size: 13px; }
            #chat {
                flex: 1;
                overflow-y: auto;
                padding: 8px 4px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .msg {
                max-width: 80%;
                padding: 10px 14px;
                border-radius: 14px;
                line-height: 1.45;
                font-size: 14px;
                white-space: pre-wrap;
                word-wrap: break-word;
            }
            .msg.user {
                align-self: flex-end;
                background: var(--accent);
                color: #fff;
            }
            .msg.assistant {
                align-self: flex-start;
                background: var(--card);
                border: 1px solid rgba(0, 0, 0, 0.06);
            }
            .msg.tool {
                align-self: center;
                background: transparent;
                color: var(--muted);
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 11px;
                padding: 2px 8px;
                max-width: 100%;
            }
            form {
                display: flex;
                gap: 8px;
                padding-top: 12px;
            }
            input[type="text"] {
                flex: 1;
                padding: 10px 14px;
                border-radius: 999px;
                border: 1px solid rgba(0, 0, 0, 0.12);
                background: var(--card);
                font: inherit;
                color: inherit;
                outline: none;
            }
            input[type="text"]:focus { border-color: var(--accent); }
            button {
                padding: 10px 18px;
                border-radius: 999px;
                border: 0;
                background: var(--accent);
                color: #fff;
                font: inherit;
                font-weight: 500;
                cursor: pointer;
            }
            button:disabled { opacity: 0.5; cursor: default; }
            .msg.typing {
                display: inline-flex;
                gap: 4px;
                align-items: center;
                padding: 14px;
            }
            .msg.typing span {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--muted);
                opacity: 0.4;
                animation: typing 1.2s infinite;
            }
            .msg.typing span:nth-child(2) { animation-delay: 0.2s; }
            .msg.typing span:nth-child(3) { animation-delay: 0.4s; }
            @keyframes typing {
                0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
                30% { transform: translateY(-4px); opacity: 1; }
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <header>
                <h1>frontend-tool</h1>
                <p>Try: <em>"where am I?"</em> · <em>"make this page look like the ocean"</em></p>
            </header>
            <div id="chat"></div>
            <form id="form">
                <input id="input" type="text" autocomplete="off" placeholder="loading…" disabled />
                <button id="send" type="submit" disabled>send</button>
            </form>
        </div>
        <script type="module" src="/main.js"></script>
    </body>
</html>
