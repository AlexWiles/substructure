# fly.toml app configuration file generated for substructure on 2026-03-24T17:04:28+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'substructure'
primary_region = 'sin'

# Deploy: fly deploy --config fly.toml --build-arg .. or see below
[build]
  dockerfile = 'Dockerfile'

[env]
  CLIENT_TOKEN_AUDIENCE = 'substructure-client'
  CLIENT_TOKEN_ISSUER = 'substructure'
  RUST_LOG = 'info'

[[mounts]]
  source = 'substructure_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 80

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
