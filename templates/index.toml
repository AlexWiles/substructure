schema = 1

[[template]]
id = "embedded-node-openai-starter"
description = "Minimal local embedded agent (Node, embedded, OpenAI generator)"
language = "typescript"
requires_remote = false
next_steps = """
  cd {dir}
  export OPENAI_API_KEY=sk-...
  pnpm install
  pnpm start
"""

[[template]]
id = "assistant-ui-cloudflare-starter"
description = "assistant-ui chat on a Cloudflare Worker, streaming from the AG-UI endpoint (TanStack Start)"
language = "typescript"
requires_remote = false
next_steps = """
  cd {dir}
  pnpm install
  # Terminal 1 — a local engine pointed at this app's worker route:
  export OPENROUTER_API_KEY=sk-or-...
  substructure start --dev --port 9000 --worker-url http://localhost:3030/api/agent
  # Terminal 2 — the app:
  pnpm dev
"""
