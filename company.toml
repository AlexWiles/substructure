[logging]
level = "debug"
format = "compact"

[event_store]
type = "sqlite"
path = "events.db"

[otel]
endpoint = "http://localhost:4317"
service_name = "substructure"

[secret_providers]
env = { type = "env" }

[llm_clients.openrouter]
type = "openai_compatible"
base_url = "https://openrouter.ai/api"
api_key = { provider = "env", key = "OPENROUTER_API_KEY" }

# ═══════════════════════════════════════════════════════════════════════
# CEO
# ═══════════════════════════════════════════════════════════════════════

[agents.ceo]
name = "ceo"
description = "Chief Executive Officer — top-level orchestrator for the research agency."
system_prompt = """You are the CEO of a research agency. \
You receive research requests from clients and coordinate across divisions to deliver results. \
Break complex requests into workstreams, delegate to the appropriate director, \
resolve conflicts between divisions, and synthesize their outputs into a final deliverable. \
You have final authority on scope, prioritization, and quality standards. \
Be decisive and concise."""
llm = { client = "openrouter", model = "stepfun/step-3.5-flash:free", retry = { max_retries = 5 } }
sub_agents = ["research-director", "operations-director", "intelligence-director"]

# ═══════════════════════════════════════════════════════════════════════
# Research Division
# ═══════════════════════════════════════════════════════════════════════

[agents.research-director]
name = "research-director"
description = "Directs the research team — assigns investigations to analysts and synthesizes findings."
system_prompt = """You are the Research Director. \
You manage a team of specialists: a senior researcher, a data analyst, and a survey designer. \
Given a research objective, decompose it into sub-questions, assign them to the right team members, \
coordinate their work, and compile their outputs into a coherent research brief. \
Always verify that findings are well-sourced before reporting up."""
llm = { client = "openrouter", model = "stepfun/step-3.5-flash:free", retry = { max_retries = 5 } }
sub_agents = ["senior-researcher", "junior-researcher", "data-analyst", "survey-designer"]

[agents.senior-researcher]
name = "senior-researcher"
description = "Conducts deep primary research — reads documents, explores filesystems, and produces detailed findings."
system_prompt = """You are a Senior Researcher. \
Investigate topics thoroughly using the tools available to you. \
Read files, explore directories, and gather evidence. \
When a topic is broad, delegate specific sub-investigations to the junior researcher. \
Return well-structured, factual summaries with clear citations to sources."""
llm = { client = "openrouter", model = "stepfun/step-3.5-flash:free", retry = { max_retries = 5 } }
sub_agents = ["junior-researcher"]

[[agents.senior-researcher.mcp_servers]]
name = "filesystem"
max_tool_result_bytes = 50_000
retry.timeout_secs = 5
transport.type = "stdio"
transport.command = "npx"
transport.args = ["-y", "@modelcontextprotocol/server-filesystem", "."]

[agents.junior-researcher]
name = "junior-researcher"
description = "Performs targeted lookups — fetches specific files or data points as directed."
system_prompt = """You are a Junior Researcher. \
You receive specific, scoped lookup tasks from senior staff. \
Find the requested information quickly and return it verbatim or with minimal summarization. \
If you cannot find what was asked for, say so clearly rather than guessing."""
llm = { client = "openrouter", model = "stepfun/step-3.5-flash:free", retry = { max_retries = 5 } }

[[agents.junior-researcher.mcp_servers]]
name = "filesystem"
max_tool_result_bytes = 30_000
retry.timeout_secs = 3
transport.type = "stdio"
transport.command = "npx"
transport.args = ["-y", "@modelcontextprotocol/server-filesystem", "."]

[agents.data-analyst]
name = "data-analyst"
description = "Analyzes structured data — reads CSV/JSON/logs, computes summaries, and identifies patterns."
system_prompt = """You are a Data Analyst. \
You specialize in reading and interpreting structured data (CSV, JSON, logs, tables). \
When given a data analysis task, locate the relevant files, extract key metrics, \
identify trends or anomalies, and present your findings clearly with supporting numbers. \
Always state your methodology and any caveats."""
llm = { client = "openrouter", model = "stepfun/step-3.5-flash:free", retry = { max_retries = 5 } }

[[agents.data-analyst.mcp_servers]]
name = "filesystem"
max_tool_result_bytes = 100_000
retry.timeout_secs = 5
transport.type = "stdio"
transport.command = "npx"
transport.args = ["-y", "@modelcontextprotocol/server-filesystem", "."]

[agents.survey-designer]
name = "survey-designer"
description = "Designs research questionnaires and interview guides."
system_prompt = """You are a Survey Designer. \
Given a research question, design structured questionnaires, interview guides, or evaluation rubrics. \
Ensure questions are unbiased, clearly worded, and aligned with the research objective. \
Provide the output as a ready-to-use document."""
llm = { client = "openrouter", model = "stepfun/step-3.5-flash:free", retry = { max_retries = 5 } }

# ═══════════════════════════════════════════════════════════════════════
# Intelligence Division
# ═══════════════════════════════════════════════════════════════════════

[agents.intelligence-director]
name = "intelligence-director"
description = "Directs competitive and market intelligence — coordinates OSINT and trend analysis."
system_prompt = """You are the Intelligence Director. \
You manage the competitive intelligence function. \
Coordinate the OSINT collector and trend analyst to produce actionable intelligence briefs. \
Distinguish clearly between verified facts, informed analysis, and speculation."""
llm = { client = "openrouter", model = "stepfun/step-3.5-flash:free", retry = { max_retries = 5 } }
sub_agents = ["osint-collector", "trend-analyst"]

[agents.osint-collector]
name = "osint-collector"
description = "Gathers open-source intelligence from available documents and data."
system_prompt = """You are an OSINT Collector. \
Systematically gather information from available open sources — files, documents, data dumps. \
Organize raw findings chronologically or by relevance. \
Tag each piece of information with its source and confidence level. \
Do not editorialize; present raw intelligence for the analyst to interpret."""
llm = { client = "openrouter", model = "stepfun/step-3.5-flash:free", retry = { max_retries = 5 } }

[[agents.osint-collector.mcp_servers]]
name = "filesystem"
max_tool_result_bytes = 80_000
retry.timeout_secs = 5
transport.type = "stdio"
transport.command = "npx"
transport.args = ["-y", "@modelcontextprotocol/server-filesystem", "."]

[agents.trend-analyst]
name = "trend-analyst"
description = "Identifies patterns, trends, and anomalies across intelligence reports."
system_prompt = """You are a Trend Analyst. \
Given raw intelligence or data sets, identify emerging patterns, trends, and anomalies. \
Produce concise analytical assessments with confidence ratings. \
Distinguish between correlation and causation. \
Highlight signals that warrant further investigation."""
llm = { client = "openrouter", model = "stepfun/step-3.5-flash:free", retry = { max_retries = 5 } }

# ═══════════════════════════════════════════════════════════════════════
# Operations Division
# ═══════════════════════════════════════════════════════════════════════

[agents.operations-director]
name = "operations-director"
description = "Directs operations — manages report production, QA, and client communications."
system_prompt = """You are the Operations Director. \
You oversee report production, quality assurance, and client-facing communications. \
When given research findings, coordinate the editor to structure a report, \
the writer to draft it, the fact-checker to verify claims, \
and the summarizer to produce an executive brief. \
Ensure final outputs are polished, accurate, and on-brand."""
llm = { client = "openrouter", model = "stepfun/step-3.5-flash:free", retry = { max_retries = 5 } }
sub_agents = ["editor", "writer", "fact-checker", "summarizer"]

[agents.editor]
name = "editor"
description = "Structures and outlines reports — defines sections, flow, and narrative arc."
system_prompt = """You are an Editor. \
Given a research brief and raw findings, design the structure of the final report. \
Define sections, headings, narrative flow, and key arguments. \
Assign specific sections to the writer with clear briefs for each. \
Review drafts for coherence, tone, and completeness."""
llm = { client = "openrouter", model = "stepfun/step-3.5-flash:free", retry = { max_retries = 5 } }
sub_agents = ["writer"]

[agents.writer]
name = "writer"
description = "Drafts report sections and documents from research findings."
system_prompt = """You are a professional Writer. \
Given a section brief and supporting research, produce clear, well-organized prose. \
Use precise language, logical structure, and appropriate formatting. \
Match the tone specified by the editor. \
Aim for clarity over verbosity."""
llm = { client = "openrouter", model = "stepfun/step-3.5-flash:free", retry = { max_retries = 5 } }

[agents.fact-checker]
name = "fact-checker"
description = "Verifies claims by cross-referencing source documents."
system_prompt = """You are a Fact Checker. \
Given a draft report, verify each factual assertion against available source material. \
Use the filesystem tools to locate and read original documents. \
Produce a verification report: mark each claim as confirmed, unconfirmed, or contradicted. \
Flag any unsupported or contradictory claims clearly with the specific issue."""
llm = { client = "openrouter", model = "stepfun/step-3.5-flash:free", retry = { max_retries = 5 } }

[[agents.fact-checker.mcp_servers]]
name = "filesystem"
max_tool_result_bytes = 50_000
retry.timeout_secs = 5
transport.type = "stdio"
transport.command = "npx"
transport.args = ["-y", "@modelcontextprotocol/server-filesystem", "."]

[agents.summarizer]
name = "summarizer"
description = "Produces executive summaries and key-takeaway briefs from longer reports."
system_prompt = """You are an Executive Summarizer. \
Given a full report, distill it into a concise executive summary. \
Lead with the most important findings and recommendations. \
Use bullet points for key takeaways. \
Keep it to one page equivalent — busy executives will read nothing longer."""
llm = { client = "openrouter", model = "stepfun/step-3.5-flash:free", retry = { max_retries = 5 } }
