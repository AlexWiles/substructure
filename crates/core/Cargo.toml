[package]
name = "substructure-core"
version = "0.1.18"
edition = "2021"
description = "Core runtime for Substructure"
license-file = "LICENSE"

[[bin]]
name = "substructure"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dialoguer = "0.11"
dirs = "5"
serde_urlencoded = "0.7"
toml = "0.8"
async-trait = "0.1.89"
axum = { version = "0.8", features = ["default"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
eventsource-stream = "0.2"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = "9"
rand = "0.9"
reqwest = { version = "0.13.2", features = ["stream", "json"] }
rust_decimal = { version = "1.40.0", features = ["serde-with-str"] }
rusqlite = { version = "0.35", features = ["bundled", "unlock_notify"] }
sea-query = { version = "1.0.0-rc.1", features = ["derive", "backend-sqlite", "with-chrono", "with-json", "with-uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1.18"
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v7"] }
webbrowser = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
