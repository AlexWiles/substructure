[package]
name = "substructure-core"
version = "0.3.0"
edition = "2021"
description = "Core runtime for Substructure"
license-file = "LICENSE"

[[bin]]
name = "subs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dialoguer = "0.11"
dirs = "5"
serde_urlencoded = "0.7"
toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }
async-trait = "0.1.89"
axum = { version = "0.8", features = ["default"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
eventsource-stream = "0.2"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
tar = "0.4"
hmac = "0.12"
jsonwebtoken = "9"
rand = "0.9"
reqwest = { version = "0.13.2", features = ["stream", "json", "form"] }
rust_decimal = { version = "1.40.0", features = ["serde-with-str"] }
schemars = { version = "1", features = ["chrono04", "rust_decimal1"] }
rusqlite = { version = "0.40", features = ["bundled", "unlock_notify", "fallible_uint"] }
sea-query = { version = "1.0.0-rc.1", features = ["derive", "backend-sqlite", "with-chrono", "with-json", "with-uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde_path_to_error = "0.1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1.18"
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v5", "v7"] }
webbrowser = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
jsonschema = { version = "0.47.0", default-features = false }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
ctrlc = "3.5.2"

[dev-dependencies]
proptest = "1.11.0"
